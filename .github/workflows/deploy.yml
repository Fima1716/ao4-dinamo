name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Выложить на сервер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
          EOF

      - name: Проверить вёрстку на битые ссылки
        run: |
          bad=0
          for page in index.html variant1/index.html variant2/index.html variant2-full/index.html final/index.html; do
            dir=$(dirname "$page")
            refs=$(grep -oE '(src|href)="[^"#?:]+\.(png|jpg|jpeg|svg|webp|css|js)"' "$page" | sed -E 's/.*="([^"]+)"/\1/' | sort -u)
            for ref in $refs; do
              if [ ! -f "$dir/$ref" ]; then
                echo "::error file=$page::нет файла $ref"
                bad=1
              fi
            done
          done
          [ "$bad" = 0 ] || exit 1
          echo "Все ссылки на файлы на месте"

      - name: Проставить версию стилям и скриптам
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i -E "s#(href|src)=\"([^\"?:]+\.(css|js))\"#\1=\"\2?v=$v\"#g" final/index.html
          grep -o 'mobile.css?v=[0-9a-f]*' final/index.html

      - name: Собрать веб-корень (финалка на базовом URL)
        run: |
          rm -rf _site
          rsync -rlD \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'pravki' --exclude 'api' --exclude '_site' \
            --exclude 'README.md' --exclude 'AGENTS.md' \
            --exclude 'All-Smiles-*' --exclude 'assets/brand/guidebook.pdf' \
            --exclude '_t.html' --exclude '_d.html' --exclude '_m.html' \
            ./ _site/
          # старый выбор вариантов (корневой index.html) уводим на /varianty/
          mkdir -p _site/varianty
          mv _site/index.html _site/varianty/index.html
          # у селектора относительные пути от корня — добавляем <base href="/">
          sed -i 's#<head>#<head><base href="/">#' _site/varianty/index.html
          # финалка становится базовым URL: её содержимое кладём в корень.
          # /final/ остаётся как алиас, варианты — на /variant1 /variant2 /variant2-full
          cp -a _site/final/. _site/
          echo "=== содержимое веб-корня ==="; ls -1 _site

      - name: Выложить сайт
        run: |
          rsync -rlDz --checksum --delete --no-perms --no-owner --no-group \
            --exclude 'api' --exclude 'pravki' \
            _site/ deploy:/var/www/ao4-dinamo/

      - name: Обновить API редактора, если он менялся
        run: |
          changed=$(rsync -az --itemize-changes api/server.js deploy:/var/www/ao4-api/server.js)
          if [ -n "$changed" ]; then
            echo "server.js обновлён, перезапускаю"
            # без --update-env: окружение процесса (в т.ч. EDITOR_PASSWORD) сохраняется
            ssh deploy 'pm2 reload ao4-api'
          else
            echo "server.js без изменений, перезапуск не нужен"
          fi

      - name: Проверить, что сайт отвечает
        run: |
          base="https://allsmiles.217-18-60-60.sslip.io"
          ok=1
          for p in "" vrachi/tsahaev/ final/ final/vrachi/tsahaev/ varianty/ variant1/ variant2/ variant2-full/ api/content?page=/final/; do
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/$p" || true)
              [ "$code" = "200" ] && break
              sleep 3
            done
            echo "$p -> $code"
            [ "$code" = "200" ] || ok=0
          done
          [ "$ok" = 1 ] || { echo "::error::какая-то страница не отдаёт 200"; exit 1; }
