name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Выложить на сервер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
          EOF

      - name: Проверить вёрстку на битые ссылки
        run: |
          python3 - <<'PY'
          import os, re, glob, sys
          pages = ['index.html'] + sorted(glob.glob('vrachi/*/index.html')) + \
                  [p for p in ('policy/index.html', 'thanks/index.html', 'admin/index.html') if os.path.isfile(p)]
          bad = 0
          for page in pages:
              d = os.path.dirname(page)
              html = open(page, encoding='utf-8').read()
              for m in re.finditer(r'(?:src|href)="([^"#?]+\.(?:png|jpg|jpeg|svg|webp|css|js))"', html):
                  ref = m.group(1)
                  if ref.startswith(('http', '//', 'data:')):
                      continue
                  stack = []
                  for seg in (d + '/' + ref).split('/'):
                      if seg in ('', '.'):
                          continue
                      if seg == '..':
                          if stack:
                              stack.pop()
                          continue
                      stack.append(seg)
                  target = '/'.join(stack)
                  if not os.path.isfile(target):
                      print(f'::error file={page}::нет файла {ref} -> {target}')
                      bad = 1
          sys.exit(1 if bad else 0)
          PY
          echo "Все ссылки на файлы на месте"

      - name: Проставить версию стилям и скриптам
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i -E "s#(href|src)=\"([^\"?:]+\.(css|js))\"#\1=\"\2?v=$v\"#g" index.html
          grep -o 'mobile.css?v=[0-9a-f]*' index.html

      - name: Выложить сайт
        run: |
          rsync -rlDz --checksum --delete --no-perms --no-owner --no-group \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'api' --exclude 'pravki' --exclude 'photozone' --exclude 'render-3d' \
            --exclude 'README.md' --exclude 'AGENTS.md' --exclude '.DS_Store' \
            --exclude 'All-Smiles-*' --exclude 'assets/brand/guidebook.pdf' \
            --exclude '_t.html' --exclude '_d.html' --exclude '_m.html' \
            ./ deploy:/var/www/ao4-dinamo/

      - name: Обновить API редактора, если он менялся
        run: |
          changed=$(rsync -az --itemize-changes api/server.js deploy:/var/www/ao4-api/server.js)
          if [ -n "$changed" ]; then
            echo "server.js обновлён, перезапускаю"
            ssh deploy 'pm2 reload ao4-api'
          else
            echo "server.js без изменений, перезапуск не нужен"
          fi

      - name: Проверить, что сайт отвечает
        run: |
          base="https://allsmiles.217-18-60-60.sslip.io"
          ok=1
          for p in "" vrachi/tsahaev/ policy/ docs/dogovor-obrazec.pdf robots.txt sitemap.xml api/content?page=/final/; do
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/$p" || true)
              [ "$code" = "200" ] && break
              sleep 3
            done
            echo "$p -> $code"
            [ "$code" = "200" ] || ok=0
          done
          [ "$ok" = 1 ] || { echo "::error::какая-то страница не отдаёт 200"; exit 1; }
